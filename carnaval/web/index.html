<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF8FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111218" media="(prefers-color-scheme: dark)">
<title>Carnaval</title>
<!-- Telegram WebApp JS SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Typography: Onest -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Mattering Design System CSS Layers -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/more.css">
<script>
  document.documentElement.className = 'js';
  const isWeak = (navigator.deviceMemory && navigator.deviceMemory < 4) || (navigator.connection && navigator.connection.saveData);
  if (!isWeak && /Chrom(e|ium)\//.test(navigator.userAgent) && !/Firefox/.test(navigator.userAgent)) {
    document.documentElement.classList.add('refract');
  }
</script>
</head>
<body>
<!-- SVG Displacement Filter for Apple Liquid Glass Refraction -->
<svg class="defs" aria-hidden="true">
  <filter id="lg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage preserveAspectRatio="none" result="m" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='x'%3E%3Cstop offset='0' stop-color='%23f00'/%3E%3Cstop offset='.16' stop-color='%23800000'/%3E%3Cstop offset='.84' stop-color='%23800000'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3ClinearGradient id='y' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230f0'/%3E%3Cstop offset='.16' stop-color='%23008000'/%3E%3Cstop offset='.84' stop-color='%23008000'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23x)'/%3E%3Crect width='100' height='100' fill='url(%23y)' style='mix-blend-mode:screen'/%3E%3C/svg%3E"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="28" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- Top-bar Header with interactive profile identity button -->
<header class="nav glass rv in" id="top-bar" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;max-width:692px;margin:0 auto;z-index:20;display:none">
  <b style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="location.hash='dashboard'">
    <svg style="width:20px;height:20px;color:var(--primary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"/><path d="M9 12h6M12 9v6"/>
    </svg>
    <span>Carnaval</span>
  </b>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="offline-badge" class="badge" style="display:none;background:var(--err);color:#fff">Офлайн</span>
    <a href="#/profile" class="ib press profile-identity-btn" id="topbar-profile-btn" aria-label="Профиль" style="text-decoration:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>
      </svg>
    </a>
  </div>
</header>

<div id="app"></div>

<!-- Scrim & Bottom Sheet (создать / детали) -->
<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-label="Действия">
  <div class="hd" id="hd"><div class="grab"><i></i></div><h3 id="sheet-title">Действия</h3></div>
  <div id="sheet-content"></div>
</div>

<!-- Splash screen (показывается до полной загрузки) -->
<div id="splash" aria-hidden="true">
  <div class="splash-logo">
    <svg viewBox="0 0 48 48" fill="none">
      <rect x="4" y="4" width="40" height="40" rx="14" fill="var(--primary)"/>
      <path d="M14 24h20M24 14l10 10-10 10" stroke="var(--on-primary)"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <p class="splash-label">Carnaval</p>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
